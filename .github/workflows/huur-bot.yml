name: Utrecht Huur Bot

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: huur-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m compileall -q bot.py tests

      - name: Run bot once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Upload veilige scrape-diagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ ! -f seen.json ]; then
            echo "seen.json bestaat niet."
            exit 0
          fi

          git add seen.json

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in seen.json."
            exit 0
          fi

          git commit -m "chore: update huur-bot state"
          git pull --rebase origin main
          git push origin main

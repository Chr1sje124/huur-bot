name: Utrecht Huur Bot

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: huur-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Save seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ ! -f seen.json ]; then
            echo "seen.json bestaat niet."
            exit 0
          fi

          # Wijzigingen tijdelijk parkeren
          git add seen.json

          # Alleen doorgaan als er daadwerkelijk iets is veranderd
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in seen.json."
            exit 0
          fi

          git commit -m "Update seen listings"

          # Haal de nieuwste main op en zet jouw commit er netjes bovenop (rebase)
          git pull --rebase origin main
          
          # Push de wijziging veilig naar GitHub
          git push origin main
